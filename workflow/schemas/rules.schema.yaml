$schema: "http://json-schema.org/draft-04/schema#"
description: snakemake rule input and output files description file
type: object
properties:
# Entry added using Hydra-Genetics CLI - please move it into alphabetically sorted order
  alignment_ont_bam_index:
    type: object
    description: input and output parameters for alignment_ont_bam_index
    properties:
      input:
        type: string
        description: input sorted bam file to be indexed
      output:
        type: string
        description: output bam index file
# Entry added using Hydra-Genetics CLI - please move it into alphabetically sorted order
  alignment_ont_bam_softclip:
    type: object
    description: input and output parameters for alignment_ont_bam_softclip
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          bam:
            type: string
            description: input bam file to be softclipped
          amplibed:
            type: string
            description: bed file wih the coordinates of the amplicons to be used for softclipping
      output:
        type: object
        description: list of outputs
        properties:
          bamclip:
            type: string
            description: output bam file from softclipping
          bamclipidx:
            type: string
            description: output bam index file from softclipping
          summary:
            type: string
            description: output summary file with stats about the softclipping
# Entry added using Hydra-Genetics CLI - please move it into alphabetically sorted order
  alignment_ont_bam_sort:
    type: object
    description: input and output parameters for alignment_ont_bam_sort
    properties:
      input:
        type: string
        description: input bam file to be sorted
      output:
        type: string
        description: output sorted bam file
# Entry added using Hydra-Genetics CLI - please move it into alphabetically sorted order
  alignment_ont_dorado_align:
    type: object
    description: input and output parameters for alignment_ont_dorado_align
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          fastqgz:
            type: string
            description: fastq.gz file to be aligned
          ref_data:
            type: string
            description: reference data to be used for alignment
      output:
        type: object
        description: list of outputs
        properties:
          bam:
            type: string
            description: output bam file from alignment
# Entry added using Hydra-Genetics CLI - please move it into alphabetically sorted order
  alignment_ont_split_bam_by_target:
    type: object
    description: input and output parameters for alignment_ont_split_bam_by_target
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          bam:
            type: string
            description: input bam file to be split by target
          bai:
            type: string
            description: input bam index file to be used for splitting
          amplibed:
            type: string
            description: bed file wih the coordinates of the amplicons to be used for splitting
      output:
        type: object
        description: list of outputs
        properties:
          bam:
            type: string
            description: output bam file for each target amplicon
          bai:
            type: string
            description: output bam index file from splitting by target
          txt:
            type: string
            description: > 
              output text file for each amplicon with what reads IDs were written 
              in the output bam file for that amplicon
# Entry added using Hydra-Genetics CLI - please move it into alphabetically sorted order
  alignment_ont_split_bam_target_j3:
    type: object
    description: input and output parameters for alignment_ont_split_bam_target_j3
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          bam:
            type: string
            description: input bam file to be split for target J3 only
          bai:
            type: string
            description: input bam index file to be used for splitting
          amplibed:
            type: string
            description: bed file wih the coordinates of the amplicons to be used for splitting
      output:
        type: object
        description: list of outputs
        properties:
          bam:
            type: string
            description: output bam file for target amplicon J3 only
          bai:
            type: string
            description: output bam index file from splitting by target
          txt:
            type: string
            description: > 
              output text file for amplicon J3 with what reads IDs were written 
              in the output bam file for that amplicon
# Entry added using Hydra-Genetics CLI - please move it into alphabetically sorted order
  basecalling_dorado_basecaller:
    type: object
    description: input and output parameters for basecalling_dorado_basecaller. Basecalling in simplex mode with adapter trimming.
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          pod5:
            type: string
            description: pod5 file to be basecalled
          ref_data:
            type: string
            description: reference data to be used for basecalling
      output:
        type: object
        description: list of outputs
        properties:
          bam:
            type: string
            description: output bam file from basecalling in simplex mode with adapter trimming
# Entry added using Hydra-Genetics CLI - please move it into alphabetically sorted order
  basecalling_dorado_duplex:
    type: object
    description: input and output parameters for basecalling_dorado_duplex. Basecalling in duplex mode with adapter trimming.
    properties:
      input:
        type: object
        description: list of inputs
        properties:
          pod5:
            type: string
            description: pod5 file to be basecalled
          ref_data:
            type: string
            description: reference data to be used for basecalling
      output:
        type: object
        description: list of outputs
        properties:
          bam:
            type: string
            description: output bam file from basecalling in duplex mode with adapter trimming