            description: input vcf file in which the VAF INFO field needs to be renamed to AF
          tbi:
            type: string
            description: input vcf index file
          txt:
            type: string
            description: input text file with the string patterns to replace in the INFO field of the input vcf file
      output:
        type: object
        description: list of outputs
        properties:
          vcf:
            type: string
            description: output vcf file
# Entry added using Hydra-Genetics CLI - please move it into alphabetically sorted order
