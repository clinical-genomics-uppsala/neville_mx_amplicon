---
 files:
#   - name: "samples_tsv"
#     output: "Results/{experiment}_{sample}_{type}_samples.tsv"
#     input: "samples.tsv"
#
#   - name: "units_tsv"
#     output: "Results/{experiment}_{sample}_{type}_units.tsv"
#     input: "units.tsv"
#
#   - name: "config_yaml"
#     output: "Results/{experiment}_{sample}_{type}_config.yaml"
#     input: "config/config.yaml"

   - name: "unfiltered_fastq"
     output: "Results/Data/{experiment}_{sample}_{type}.ont_reads.unfiltered.fastq.gz"
     input: "basecalling/dorado_duplex/{experiment}_{sample}_{type}_reads.ont_adapt_trim.fastq.gz"

   - name: "filtered_fastq"
     output: "Results/Data/{experiment}_{sample}_{type}.ont_reads.filtered.fastq.gz"
     input: "prealignment/filtlong/{experiment}_{sample}_{type}_reads.ont_adapt_trim.filtered.fastq.gz"

   - name: "soft_clipped_bam"
     output: "Results/Data/{experiment}_{sample}_{type}.ont_reads.filtered.aligned.sorted.soft-clipped.bam"
     input: "alignment/dorado_align/{experiment}_{sample}_{type}_reads.ont_adapt_trim.filtered.aligned.sorted.soft-clipped.bam"

   - name: "soft_clipped_bam_bai"
     output: "Results/Data/{experiment}_{sample}_{type}.ont_reads.filtered.aligned.sorted.soft-clipped.bam.bai"
     input: "alignment/dorado_align/{experiment}_{sample}_{type}_reads.ont_adapt_trim.filtered.aligned.sorted.soft-clipped.bam.bai"

   - name: "sniffles2_var_calls"
     output: "Results/Data/{experiment}_{sample}_{type}.ont_reads.cnv-sv.vcf.gz"
     input: "cnv_sv/sniffles2/{experiment}_{sample}_{type}_reads.ont_adapt_trim.filtered.aligned.sorted.soft-clipped.sniffles2.bcftools_view.vcf.gz"

   - name: "pycoqc_report"
     output: "Results/Reports/{experiment}_{sample}_{type}_sequencing_report_pycoqc.html"
     input: "results/pycoqc/{experiment}_{sample}_{type}_report_sequencing_summary.html"

   - name: "snv_indels_var_calls_ensembled_annotated_soft_filtered"
     output: "Results/Data/{experiment}_{sample}_{type}.ont_reads.snv-indels.vcf"
     input: "snv_indels/bcbio_variation_recall_ensemble/{experiment}_{sample}_{type}.ensembled.vep_annotated.rename_vaf.filter.somatic_soft.vcf"

   - name: "sequali_reports"
     output: "Results/Reports/{experiment}_{sample}_{type}.ont_reads.filtered.fastq.gz.html"
     input: "results/sequali/{experiment}_{sample}_{type}_reads.ont_adapt_trim.filtered.fastq.gz.html"

   - name: "multiqc_report"
     output: "Results/Reports/{experiment}_{sample}_{type}_multiqc_{report}.html"
     input: "results/qc/multiqc/{experiment}_{sample}_{type}_multiqc_{report}.html"

   - name: "excel_report"
     output: "Results/Reports/{experiment}_{sample}_{type}.xlsx"
     input: "reports/xlsx/{experiment}_{sample}_{type}.xlsx"