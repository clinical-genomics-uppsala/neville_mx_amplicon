---
REFERENCE_DATA: /proj/ngi2024001/nobackup/bin/wp2_mxa/design_and_ref_files

APPTAINER_CACHE: /proj/ngi2024001/nobackup/bin/wp2_mxa/apptainer_cache

hydra_local_path: /proj/ngi2024001/nobackup/bin/wp2_mxa/{{TAG_OR_BRANCH}}/hydra-genetics

DORADO_MODELS: /proj/ngi2024001/nobackup/projects/wp3/GMS_str/dorado_models

output: "config/output_files.yaml"
resources: "config/resources_miarka.yaml"
samples: "config/samples.tsv"
units: "config/units.tsv"
samples_run: "samples.tsv"
units_run: "units.tsv"

# Modules

modules:
  annotation: "v1.0.0"
  cnv_sv: "v0.9.0"
  filtering: "v1.1.0"
  snv_indels: "v1.1.0"
  qc: "v0.5.0"  # "a5e356d": commit hash which is compatible with long-read units.tsv files, otherwise use "v0.5.0"

# Custom keys and values below

ref_data: "{{REFERENCE_DATA}}/neville_mx_amplicon/GCA_000001405.15_GRCh38_no_alt_analysis_set_GRCmasked.fasta"  # use common reference genome for all analyses?
bed_files: "{{REFERENCE_DATA}}/neville_mx_amplicon/bedfiles"
reference:
  design_intervals:
    "{{REFERENCE_DATA}}/neville_mx_amplicon/bedfiles/amplicons.interval_list"
  fasta:
    "{{REFERENCE_DATA}}/neville_mx_amplicon/GCA_000001405.15_GRCh38_no_alt_analysis_set_GRCmasked.fasta"
  fai:
    "{{REFERENCE_DATA}}/neville_mx_amplicon/GCA_000001405.15_GRCh38_no_alt_analysis_GRCset_masked.fasta.fai"
  sequence_dict:
    "{{REFERENCE_DATA}}/neville_mx_amplicon/GCA_000001405.15_GRCh38_no_alt_analysis_set_GRCmasked.dict"
  design_bed:
    "{{REFERENCE_DATA}}/neville_mx_amplicon/bedfiles/amplicons.bed"

# All runs
runfolder: "{{runfolder}}"
batchid: "{{batchid}}"
runid: "{{runid}}"
multisample: "{{multisample}}"
samplesheet: "{{samplesheet}}"
raw_data: "pod5"
timestep_minknow: 10

dorado_model: "dna_r10.4.1_e8.2_400bps_sup@v5.2.0"
dorado_model_extra: "dna_r10.4.1_e8.2_5khz_stereo@v1.4"  # dependency model for duplex basecalling, can be empty string

amplicons:
  ["FLT3_ITD_3kb_1", "FLT3_TKD_3kb_1",
  "IDH1_1", "IDH2_1",
  "NPM1_5",
  "TP53_3kb_A1", "TP53_3kb_B1", "TP53_C10", "TP53_J3", "TP53_D2", "TP53_E1", "TP53_F2", "TP53_G4", "TP53_H4", "TP53_I4"
  ]

extra_regions:
  ["TP53_3kb_A1_only", "TP53_3kb_B1_only", "TP53_C10_only", "TP53_D2+J3", "TP53_D2_only",
  "TP53_E1_only", "TP53_F2_only", "TP53_G4_only", "TP53_H4_only", "TP53_I4_only"
  ]

pools:
  1: ["TP53_3kb_A1_only", "TP53_D2_only", "TP53_F2_only", "TP53_I4_only", "FLT3_TKD_3kb_1"]
  2: ["IDH1_1", "TP53_3kb_B1_only", "TP53_G4_only", "TP53_D2+J3", "NPM1_5"]
  3: ["IDH2_1", "TP53_C10_only", "TP53_E1_only", "TP53_H4_only", "FLT3_ITD_3kb_1"]


# Containers

default_container: "{{APPTAINER_CACHE}}/hydragenetics__common_3.0.0.sif"

alignment_ont_bam_index:
  container: "{{APPTAINER_CACHE}}/hydragenetics__samtools_1.21.sif"

alignment_ont_bam_softclip:
  container: "{{APPTAINER_CACHE}}/hydragenetics__samtools_1.21.sif"

alignment_ont_bam_sort:
  container: "{{APPTAINER_CACHE}}/hydragenetics__samtools_1.21.sif"

alignment_ont_dorado_align:
  container: "{{APPTAINER_CACHE}}/ontresearch__dorado_latest.sif"

alignment_ont_split_bam_by_target:
  container: "{{APPTAINER_CACHE}}/hydragenetics__samtools_1.21.sif"

alignment_ont_split_bam_target_j3:
  container: "{{APPTAINER_CACHE}}/hydragenetics__samtools_1.21.sif"

basecalling_bam_to_fastq:
  container: "{{APPTAINER_CACHE}}/hydragenetics__samtools_1.21.sif"

basecalling_compress_fastq:
  container: "{{APPTAINER_CACHE}}/hydragenetics__samtools_1.21.sif"

basecalling_dorado_basecaller:  # simplex basecalling by default
  container: "{{APPTAINER_CACHE}}/ontresearch__dorado_latest.sif"
  model: "{{dorado_model}}"
  trim: "--trim adapters"
  extra: "--device cuda:all"

basecalling_dorado_demux:
  container: "{{APPTAINER_CACHE}}/ontresearch__dorado_latest.sif"
  kit: "--kit-name SQK-NBD114-24"

basecalling_dorado_duplex:  # duplex basecalling
  container: "{{APPTAINER_CACHE}}/ontresearch__dorado_latest.sif"
  model: "{{dorado_model}}"
  trim: "--no-trim-primers --sequencing-kit SQK-LSK114"
  extra: "--device cuda:all"

basecalling_dorado_duplex_multisamples:
  container: "{{APPTAINER_CACHE}}/dorado_1.1.1+e72f1492.sif"  # ontresearch__dorado_latest.sif"
  model: "{{dorado_model}}"
  trim: ""  # no trim because samples are demultiplexed in a later step
  extra: "--device cuda:0,1"

basecalling_dorado_trim:
  container: "{{APPTAINER_CACHE}}/ontresearch__dorado_latest.sif"
  trim: "--sequencing-kit SQK-NBD114-24"

prealignment_ont_filtlong:
    container: "{{APPTAINER_CACHE}}/hydragenetics__filtlong_0.2.1.sif"  # "docker://quay.io/biocontainers/filtlong:0.2.1--hdcf5f25_4"
    min_length: 2000
    max_length: 4000

prealignment_ont_fetch_filtered_reads:
  container: "{{APPTAINER_CACHE}}/hydragenetics__samtools_1.21.sif"

prefiltering_bcftools_include_region:
  filter:
    sniffles2:
      extra: "-R {{REFERENCE_DATA}}/neville_mx_amplicon/bedfiles/amplicons-sniffles2.bed"

prefiltering_bcftools_view:
  filter:
    deepsomatic:
      extra: "-i 'QUAL>0'"
    clairs_to:
      extra: "-e 'FILTER==\"LowQual\" & QUAL==0'"
    vardict:
      extra: "-i 'QUAL>120'"

qc_ont_mosdepth_overlap:
  container: "{{APPTAINER_CACHE}}/hydragenetics__mosdepth_0.3.6.sif"
  by: "amplicons.bed"

qc_ont_mosdepth_overlap_timestep:
  container: "{{APPTAINER_CACHE}}/hydragenetics__mosdepth_0.3.6.sif"
  by: "amplicons.bed"

qc_ont_picard_bed_to_interval_list:
  container: "{{APPTAINER_CACHE}}/hydragenetics__picard_2.25.4.sif"

picard_collect_alignment_summary_metrics:
  container: "{{APPTAINER_CACHE}}/hydragenetics__picard_2.25.4.sif"
  extra: "--tmp_dir=/scratch/$SLURM_JOB_ID"

picard_collect_hs_metrics:
  container: "{{APPTAINER_CACHE}}/hydragenetics__picard_2.25.4.sif"
  extra: "--tmp_dir=/scratch/$SLURM_JOB_ID"

qc_ont_plot_yield_timestep:
  container: "{{APPTAINER_CACHE}}/hydragenetics__common-plots_3.1.1.sif"

qc_ont_pycoqc:
  container: "{{APPTAINER_CACHE}}/nanozoo__pycoqc_2.5.0.23--320ecc7.sif"

qc_ont_sequali:
  container: "{{APPTAINER_CACHE}}/hydragenetics__sequali_0.12.0.sif"

snv_indels_svs_clairs_to:
  container: "{{APPTAINER_CACHE}}/hkubal__clairs-to_v0.4.0.sif"
  platform: "ont_r10_dorado_sup_5khz"
  snv_min_af: 0.005
  indel_min_af: 0.005
  bed_file: "{{REFERENCE_DATA}}/neville_mx_amplicon/bedfiles/amplicons-clairs-to.bed"

snv_indels_svs_deepsomatic:
  container: "{{APPTAINER_CACHE}}/google__deepsomatic_1.9.0.sif"
  extra: '--make_examples_extra_args="vsc_min_fraction_snps=0.01,vsc_min_fraction_indels=0.01,small_model_snp_gq_threshold=20,small_model_indel_gq_threshold=20"'
  # filter: '--use_default_pon_filtering=true --qual_filter=0.1'
  bed_file: "{{REFERENCE_DATA}}/neville_mx_amplicon/bedfiles/amplicons-exons-deepsomatic.bed"

snv_indels_svs_savana:
  container: "{{APPTAINER_CACHE}}/hydragenetics__savana_1.3.5.sif"

################################################################
################################################################

bcbio_variation_recall_ensemble:
  container: "{{APPTAINER_CACHE}}/hydragenetics__bcbio-vc_0.2.6.sif"
  callers:
    - clairs_to
    - deepsomatic
    - vardict
  support: 1

filter_vcf:
  somatic_soft: "config/config_soft_filter_somatic.yaml"
  somatic_hard: "config/config_hard_filter_somatic.yaml"

mosdepth:
  container: "{{APPTAINER_CACHE}}/hydragenetics__mosdepth_0.3.6.sif"
  by: "amplicons.bed"

mosdepth_bed:
  container: "{{APPTAINER_CACHE}}/hydragenetics__mosdepth_0.3.6.sif"
  thresholds: "1,5,100,500,1000"

mosdepth_exons:
  container: "{{APPTAINER_CACHE}}/hydragenetics__mosdepth_0.3.6.sif"
  bed: "exon_coverage.bed"
  thresholds: "1,5,100,500,1000"

multiqc:
  container: "{{APPTAINER_CACHE}}/hydragenetics__multiqc_1.25.1.sif" # sequali requires 1.25.1, fixes for HsMetrics require 1.21
  reports:
    amplicons:
      config: "config/multiqc_config.yaml"
      qc_files:
        - "results/sequali/{experiment}_{sample}_{type}_reads.ont_adapt_trim.filtered.fastq.gz.json"
        - "results/sequali/{experiment}_{sample}_{type}_reads.ont_adapt_trim.filtered.fastq.gz.html"
        - "results/sequali/{experiment}_{sample}_{type}_reads.ont_adapt_trim.filtered.out.fastq.gz.json"
        - "results/sequali/{experiment}_{sample}_{type}_reads.ont_adapt_trim.filtered.out.fastq.gz.html"
        - "results/pycoqc/{experiment}_{sample}_{type}_report_sequencing_summary.json"
        - "prealignment/filtlong/{experiment}_{sample}_{type}.filtlong.log"
        - "results/mosdepth/{experiment}_{sample}_{type}_amplicons.regions.bed.gz"
        - "results/mosdepth/{experiment}_{sample}_{type}_amplicons.mosdepth.global.dist.txt"
        - "results/mosdepth/{experiment}_{sample}_{type}_amplicons.mosdepth.region.dist.txt"
        - "results/mosdepth/{experiment}_{sample}_{type}_amplicons.mosdepth.summary.txt"
        - "results/mosdepth_bed/{experiment}_{sample}_{type}_{target}.mosdepth.summary.txt"
        - "results/mosdepth_bed/{experiment}_{sample}_{type}_{target}.mosdepth.region.dist.txt"
        - "results/mosdepth_bed/{experiment}_{sample}_{type}_{target}.regions.bed.gz"
        - "results/mosdepth_bed/{experiment}_{sample}_{type}_{target}.per-base.bed.gz"
        - "results/mosdepth_bed/{experiment}_{sample}_{type}_{target}.thresholds.bed.gz"
        - "results/qc/samtools_ampliconclip/{experiment}_{sample}_{type}_ampliconclip.txt"
        - "results/qc/picard/{experiment}_{sample}_{type}_HsMetrics.txt"
        - "results/qc/picard/{experiment}_{sample}_{type}_{target}.alignment_summary_metrics.txt"
        - "results/qc/picard/{experiment}_{sample}_{type}_TP53_J3_only.alignment_summary_metrics.txt"
        - "results/qc/picard/{experiment}_{sample}_{type}.alignment_summary_metrics.txt"

gatk_mutect2:
  container: "{{APPTAINER_CACHE}}/hydragenetics__gatk4:4.6.2.0"

picard_collect_hs_metrics:
  container: "{{APPTAINER_CACHE}}/hydragenetics__picard_2.25.4.sif"

picard_bed_to_interval_list:
  container: "{{APPTAINER_CACHE}}/hydragenetics__picard_2.25.4.sif"

picard_collect_alignment_summary_metrics:
  container: "{{APPTAINER_CACHE}}/hydragenetics__picard_2.25.4.sif"

sniffles2_call:
  container: "{{APPTAINER_CACHE}}/hydragenetics__sniffles2_2.6.1.sif"
  extra: "--minsvlen 3"
  # bed_file: Sniffles2 cannot be restricted to specific regions, variant filtering is required post-calling

vardict:
  container: "{{APPTAINER_CACHE}}/hydragenetics__vardict_1.8.3.sif"
  allele_frequency_threshold: "0.002"
  extra: "-k 0 -L 1000 -a 50:0.95"
  bed_file: "{{REFERENCE_DATA}}/neville_mx_amplicon/bedfiles/NPM1-FLT3-vardict.bed"
  bed_columns: "-c 1 -S 2 -E 3 -g 4"
  threads: 20

vep:
  container: "{{APPTAINER_CACHE}}/hydragenetics__vep_111.0.sif"
  vep_cache: "{{REFERENCE_DATA}}/neville_mx_amplicon/VEP"
  mode: "--offline --cache --merged "
  extra: " --format vcf --assembly GRCh38 --check_existing --pick --variant_class --everything  --pick_order mane_select,mane_plus_clinical,canonical,biotype,rank,appris,tsl,ccds,length,ensembl,refseq"

vt_decompose:
  container: "{{APPTAINER_CACHE}}/hydragenetics__vt_2015.11.10.sif"

vt_normalize:
  container: "{{APPTAINER_CACHE}}/hydragenetics__vt_2015.11.10.sif"
